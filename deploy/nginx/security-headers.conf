# Security headers for SlowedLab.
#
# Install to /etc/nginx/snippets/security-headers.conf and include it at
# server level. IMPORTANT: nginx's add_header does not inherit into a
# location that declares its own add_header, so any location setting
# Cache-Control must include this snippet too.
#
#   include /etc/nginx/snippets/security-headers.conf;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;