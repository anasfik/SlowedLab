# Security + policy headers for SlowedLab (single source of truth).
#
# Install to /etc/nginx/snippets/security-headers.conf and include it in
# EVERY location of the 443 server that sets any add_header (Cache-Control
# etc.), because nginx drops ALL inherited add_headers the moment a location
# defines its own. Do NOT also include it at server level — that double-emits
# every header. The upstream app container must not set add_header at all.
#
#   location / {
#       include /etc/nginx/snippets/security-headers.conf;
#       add_header Cache-Control "no-cache" always;
#   }

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# HTTPS-only in practice: this snippet is included solely in the 443 server.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# Report-only while the inline gtag bootstrap exists; blocks nothing.
add_header Content-Security-Policy-Report-Only "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com; frame-ancestors 'self'" always;
