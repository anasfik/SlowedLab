# SlowedLab — nginx reverse proxy for slowedlab.app
#
# Header policy: this edge sets ALL response headers (security, HSTS,
# Cache-Control). The upstream app container MUST NOT set add_header itself —
# nginx drops inherited headers the moment a location/proxy defines its own,
# which is how every header ended up duplicated. Single source: here.
# Usage (see README "Deploying"):
#   sudo cp deploy/nginx/slowedlab.app.conf /etc/nginx/sites-available/slowedlab.app
#   sudo ln -sf /etc/nginx/sites-available/slowedlab.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.tld
#
# Step order matters: the site starts HTTP-only (port 80) so certbot can
# solve the HTTP-01 challenge; certbot then adds the listen 443 ssl block.
# Point server_name at your own domain before running certbot.
#
# IMPORTANT: the two proxy_pass ports below must match the HOST ports you
# published in .env (FRONTEND_PORT / BACKEND_PORT), not the container ports.
# Defaults here assume the committed defaults 4000 (app) / 4001 (api).

upstream slowedlab_frontend {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream slowedlab_backend {
    server 127.0.0.1:4001;
    keepalive 8;
}

server {
    server_name slowedlab.app www.slowedlab.app;

    # Canonical host: www goes straight to the apex (certbot keeps its own
    # managed ifs alongside; both must agree on the apex target).
    if ($host = www.slowedlab.app) {
        return 301 https://slowedlab.app$request_uri;
    }

    # Plain HTTP exists only for the ACME challenge, everything else is
    # forced to HTTPS (canonical host, no duplicate-content indexing).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
}

server {
    # Canonical host: apex only. www 301s here (single hop from both schemes).
    if ($host = www.slowedlab.app) {
        return 301 https://slowedlab.app$request_uri;
    }

    server_name slowedlab.app www.slowedlab.app;

    # Audio uploads are browser-local, but keep headroom for API payloads.
    client_max_body_size 50m;

    # ---- Backend API -------------------------------------------------
    # Scanner-noise paths never reach upstreams (SPA fallback would 200 them).
    location ~* ^/(wp-login\.php|xmlrpc\.php|\.env|composer\.(json|lock)|package\.json)$ {
        return 404;
    }
    location ~* ^/wp-(content|includes|admin|json|sitemap\.xml) {
        return 404;
    }
    location ~* sitemap_index\.xml$ {
        return 404;
    }

    location /api/ {
        proxy_pass http://slowedlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Link-import downloads stream: never buffer, never cache.
        proxy_buffering off;
        proxy_request_buffering off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- Frontend app ------------------------------------------------
    # Hashed CRA assets are immutable -> cache them hard.
    location /static/ {
        proxy_pass http://slowedlab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location / {
        proxy_pass http://slowedlab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # index.html / robots.txt / sitemap.xml must stay revalidated.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Compression -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # ---- Security headers (single source; see file header) -----------
    # include /etc/nginx/snippets/security-headers.conf;

    # TLS is enabled by certbot on first run: it creates
# /etc/letsencrypt/live/<domain>/ and uncomments the lines below.
# listen 443 ssl http2;
# ssl_certificate     /etc/letsencrypt/live/slowedlab.app/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/slowedlab.app/privkey.pem;
# include /etc/letsencrypt/options-ssl-nginx.conf;
# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}