services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host port is overridable via .env (BACKEND_PORT) to avoid conflicts.
      - "${BACKEND_PORT:-4001}:4001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=4001
      - MAX_AUDIO_MINUTES=15
      - LINKIMPORT_CONCURRENCY=2
      - AUDIO_CACHE_MB=1024
      - AUDIO_CACHE_FILES=100
      # Link import reads backend/data/cookies.txt automatically when present
      # (rarely needed for SoundCloud; useful for limited/private tracks).
      # Only set YTDLP_COOKIES_FILE if you keep the cookie file elsewhere.
      # - YTDLP_COOKIES_FILE=/app/data/cookies.txt
      # Optional egress override for link-import traffic (yt-dlp --proxy).
      # Lives in .env (git-ignored), never commit credentials.
      - YTDLP_PROXY=${YTDLP_PROXY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - slowedlab

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host port is overridable via .env (FRONTEND_PORT) to avoid conflicts.
      - "${FRONTEND_PORT:-4000}:4000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
    environment:
      - BACKEND_PROXY_URL=http://backend:4001
      - CHOKIDAR_USEPOLLING=true
      - PORT=4000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - slowedlab
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Production frontend: static build served by nginx, used for the public
  # site. Enable with: docker compose --profile prod up -d --build frontend-prod
  # Keep the dev `frontend` service above for hot-reload iteration.
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_PROD_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - slowedlab
    restart: unless-stopped

networks:
  slowedlab:
    driver: bridge
