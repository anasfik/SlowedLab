# Production nginx config for the built frontend.
# Served by frontend/Dockerfile.prod.
#
# The app calls its API through same-origin /api/*, so this config proxies
# /api/ to the backend service as well — that makes the prod container work
# standalone (no host-level reverse proxy required). The proxy target assumes
# the compose service name `backend` on port 4001; mount your own conf and
# adjust if you deploy the backend elsewhere.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded/pasted payloads and streamed link-import responses.
    client_max_body_size 50m;

    # ---- API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- Hashed build assets: immutable ------------------------------
    location /static/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- App shell ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Compression -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    error_page 500 502 503 504 /index.html;
}