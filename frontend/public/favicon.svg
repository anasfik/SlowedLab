<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#323842"/>
  
  <!-- Sound wave circles - representing audio -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <circle cx="50" cy="50" r="10" fill="#fff" opacity="1"/>
  
  <!-- Play symbol inside -->
  <polygon points="45,45 45,55 55,50" fill="#323842"/>
</svg>
