    <!-- Google tag (gtag.js) — deferred so analytics never blocks first paint.
         Loads on idle (or first interaction); short visits may go uncounted. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      function loadGtag(){
        if (window.__gtagLoaded) return; window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VCG3R41XZK';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-VCG3R41XZK');
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function(){ setTimeout(loadGtag, 1500); }, { timeout: 4000 });
      } else { setTimeout(loadGtag, 2500); }
      ['pointerdown','keydown','scroll'].forEach(function(e){
        window.addEventListener(e, loadGtag, { once: true, passive: true });
      });
    </script>
