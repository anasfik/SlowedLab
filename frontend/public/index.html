<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Primary Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0e0b" />
    <meta
      name="description"
      content="SlowedLab is a private browser audio studio for changing speed, adding reverb, shaping tone, and exporting finished WAV files."
    />
    <meta name="keywords" content="audio editor, audio effects, reverb, EQ, audio player, music effects, online audio editor, web audio, audio processing, distortion, compression" />
    <meta name="author" content="SlowedLab" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <link rel="canonical" href="https://slowedlab.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slowedlab.app" />
    <meta property="og:title" content="SlowedLab - Private Browser Audio Studio" />
    <meta property="og:description" content="Change speed, add reverb, shape tone, and export a finished WAV without uploading your audio." />
    <meta property="og:image" content="https://slowedlab.app/slowedlab-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:site_name" content="SlowedLab" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://slowedlab.app" />
    <meta name="twitter:title" content="SlowedLab - Private Browser Audio Studio" />
    <meta name="twitter:description" content="Change speed, add reverb, shape tone, and export a finished WAV without uploading your audio." />
    <meta name="twitter:image" content="https://slowedlab.app/slowedlab-logo.png" />
    <meta name="twitter:creator" content="@gwhyyy" />

    <!-- Additional SEO Meta Tags -->
    <meta name="rating" content="general" />
    <meta name="revisit-after" content="7 days" />
    <meta name="distribution" content="global" />
    
    <title>SlowedLab - Private Browser Audio Studio</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SlowedLab",
      "description": "Private browser audio studio for speed, reverb, EQ, compression, distortion, and WAV export",
      "url": "https://slowedlab.app",
      "applicationCategory": "Multimedia",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "image": "https://slowedlab.app/slowedlab-logo.png",
      "screenshot": "https://github.com/user-attachments/assets/8f69cc72-2134-4e11-bfa0-c3625c520892",
      "author": {
        "@type": "Person",
        "name": "Gwhyyy"
      },
      "featureList": [
        "Variable-speed playback",
        "Reverb",
        "Real-time audio effects",
        "Waveform visualization",
        "Preset management",
        "Multiple audio format support",
        "Client-side processing"
      ],
      "browserRequirements": "Requires modern browser with Web Audio API support",
      "permissions": "Audio input/output"
    }
    </script>

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
